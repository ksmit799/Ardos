# Global console output log level.
# Options are trace, debug, info, warn, error or none.
log-level: info

# DC (Distributed Class) file paths.
# These should be kept in-sync globally.
dc-files:
  - otp.dc
  - game.dc

# Do we want distributed objects to live on this instance?
want-state-server: true

# Do we want players to be able to connect to this instance?
want-client-agent: true

# Do we want to handle database operations on this instance?
want-database: true

# Do we want database-backed distributed objects to live on this instance?
want-db-state-server: true

# Do we want metrics collection on this instance?
want-metrics: true

# Do we want a web interface running on this instance?
want-web-panel: true

# UberDOG definitions.
# Some example ones follow:
uberdogs:
  - id: 4665
    class: AuthManager
    anonymous: true # Allows un-authenticated clients to communicate with this object.

  - id: 4666
    class: ChatManager
    # Run as many instances of this uberdog as you like, each message is
    # routed to exactly one, every message from one client lands on the
    # same instance while the group is stable. Handlers must not keep per
    # client state in memory.
    load-balanced: true

  - id: 4667
    class: FriendsManager

# Web Panel configuration.
# Can be accessed via the Ardos Web panel for debugging.
web-panel:
  # Components can have their own individual log level set.
  # This will override the global log level set previously.
  log-level: debug

  name: Ardos  # The cluster name to appear in the dashboard.
  port: 7781  # Port the WS connection listens on.

  # Auth options.
  # Make sure to change these in PROD environments.
  username: ardos
  password: ardos

  # SSL/TLS config for web panel.
  # The below two options can be omitted to disable SSL/TLS.
  certificate: cert.pem
  private-key: key.pem

# Metrics (Prometheus) configuration.
# This should be configured as a target in your Prometheus config.
metrics:
  host: 127.0.0.1
  port: 9985

# Message Director configuration.
message-director:
  # Listen configuration.
  host: 127.0.0.1
  port: 7100

  # Mesh configuration.
  # Every Ardos instance connects directly to every other, omit this whole
  # section to run a standalone cluster of one (typical for development.)
  mesh:
    # A unique id for this instance, required.
    # The lowest live id handles cleanup for dead peers.
    node-id: 1

    # Listen configuration for peer connections.
    host: 0.0.0.0
    port: 7200

    # Addresses of other instances to dial at startup.
    # One reachable seed is enough to discover the whole cluster,
    # every instance can share the same list, dialing yourself is fine.
    seeds:
      - 10.0.0.2:7200

    # Interval in MS between heartbeats to each peer.
    # Raise this for peers across high latency (WAN) links.
    heartbeat-interval: 1000

    # Heartbeats missed before a peer is declared dead.
    # A dead peer is never resumed, reconnecting is a fresh join.
    missed-heartbeats: 3

# State Server configuration.
state-server:
  channel: 1000

# Client Agent configuration.
client-agent:
  # Listen configuration.
  host: 127.0.0.1
  port: 6667

  # Transport protocol clients use to connect.
  # Options are tcp (default) or ws (WebSocket).
  transport: tcp

  # The logical version of the server.
  # This, along with the computed (or manual) DC hash, is used as a first point of contact to authenticate clients.
  version: dev

  # A manual override for the computed DC hash.
  # This should rarely need to be used.
  manual-dc-hash: 0xABCD1234

  # The name of the "avatar" class that clients can own.
  # This is only necessary if you want to take advantage of `setParentingRules`,
  # and/or legacy shim chatting. Otherwise, this can be omitted.
  avatar-class: DistributedPlayer

  # Enable setParentingRules-driven interest behaviour.
  # Disable if your DC has a user-level `setParentingRules` field that
  # shouldn't be interpreted as a parenting rule by the CA.
  parenting-rules: true

  # Shim's logins from Disney specific clients to an UberDOG.
  # (DoId matches AuthManager defined above.)
  # NOTE: You must build Ardos with ARDOS_USE_LEGACY_CLIENT to use this option.
  ud-auth-shim: 4665

  # Shim's chat messages from Disney specific clients to an UberDOG.
  # The original OTP server intercepted TalkPath_* field updates and
  # handled the filtering/broadcasting of those messages on the CA.
  # (DoId matches ChatManager defined above.)
  # NOTE: You must build Ardos with ARDOS_USE_LEGACY_CLIENT to use this option.
  ud-chat-shim: 4666

  # Interval in MS of heartbeat messages expected from clients.
  heartbeat-interval: 30000 # 30 seconds.

  # Time in MS required for clients to authenticate within.
  auth-timeout: 45000 # 45 seconds.

  # Time in MS before a held mutex field lock expires. 0 disables expiry.
  # Set this below your game clients own retry timeout, a lock orphaned
  # by a lost call otherwise holds until the client relogs.
  mutex-timeout: 15000 # 15 seconds.

  # Time in MS clients can attempt to send updates to once visible objects
  # without being disconnected for a security violation.
  historical-objects-ttl: 5000 # 5 seconds.

  # Interest configuration.
  # N.B. An AI server modifying a players interest will always bypass the below settings.
  interest:
    # all - Allows clients to set their own interests.
    # visible - Only allowed to set interest in zones of a visible parent object.
    # disabled - Clients aren't allowed to set their own interests (default.)
    client: all
    # whitelist - Clients will be disconnected if they attempt to add interest in a zone not listed below.
    # blacklist - Clients will be disconnected if they attempt to add interest in a zone listed below.
    # (mode can be omitted to disable this functionality)
    mode: whitelist
    # Optional array of zone IDs and/or ranges (e.g. 0, 5, "100-399")
    zones:
      - 0
      - 5
      - 10
      - "100-399"

  # Allow clients to set the location of their owned objects.
  relocate-allowed: true

  # The range of channels this CA can allocate.
  channels:
    min: 1000000000
    max: 1009999999

# Database configuration.
database-server:
  channel: 4003

  # MongoDB configuration.
  mongodb-uri: mongodb://localhost:27017/ardos

  # The range of DoId's this database server can allocate.
  generate:
    min: 100000000
    max: 399999999

# Database State Server configuration.
db-state-server:
  # The channel of the database server we should use for querying.
  database: 4003

  # The range of DoId's we should be listening for.
  # Notice how this matches our database server generate range.
  ranges:
    min: 100000000
    max: 399999999
